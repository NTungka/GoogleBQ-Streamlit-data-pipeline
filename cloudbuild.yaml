# Cloud Build config for the dbt-build-job Cloud Run Job. Triggered by a
# Cloud Build GitHub trigger on merges to main, path-filtered to
# dbt_olist/** so it only fires when something that could actually affect
# the dbt build changes (see README.md's "Automate dbt build" section for
# the trigger's exact --included-files pattern and setup).
#
# Same core mechanism as mod2_dbt_project/cloudbuild.yaml -- build image,
# push it, update the Cloud Run Job, execute it -- without that project's
# _PIPELINE_MODE branching, since this repo already keeps ingestion
# (cloud_functions/), the dashboard, and dbt in their own separate deploy
# flows rather than one shared multi-purpose image.

substitutions:
  _REGION: asia-southeast1
  _JOB_NAME: dbt-build-job

steps:
  - id: build-image
    name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/dbt-runner:$BUILD_ID
      - -t
      - gcr.io/$PROJECT_ID/dbt-runner:latest
      - dbt_olist

  - id: push-build-image
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/dbt-runner:$BUILD_ID"]

  - id: push-latest-image
    name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/dbt-runner:latest"]

  - id: update-dbt-job
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - run
      - jobs
      - update
      - ${_JOB_NAME}
      - --image=gcr.io/$PROJECT_ID/dbt-runner:$BUILD_ID
      - --region=${_REGION}

  - id: run-dbt-job
    name: "gcr.io/cloud-builders/gcloud"
    args:
      - run
      - jobs
      - execute
      - ${_JOB_NAME}
      - --region=${_REGION}
      - --wait

options:
  logging: CLOUD_LOGGING_ONLY
